global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8080']
  - job_name: 'db-service'
    static_configs:
      - targets: ['db-service:9091']
  - job_name: 'worker-service'
    static_configs:
      - targets: ['worker-service:9092']